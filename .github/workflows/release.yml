name: Release TG Proxy VPS Relay
run-name: Release TG Proxy VPS Relay ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, for example v1.0.0'
        required: true
        type: string

permissions:
  contents: write

jobs:
  check:
    name: Verify
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref }}

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          FILE_VERSION="$(tr -d '[:space:]' < VERSION)"
          VERSION="${TAG#v}"
          if [ "$VERSION" != "$FILE_VERSION" ]; then
            echo "Tag version $VERSION does not match VERSION file $FILE_VERSION" >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.22.x'
          cache: false

      - name: Run Go tests
        run: go test ./...

  build-relay:
    name: Build VPS Relay release archives
    runs-on: ubuntu-latest
    needs: check

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.check.outputs.tag }}

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.22.x'
          cache: false

      - name: Build linux archives
        shell: bash
        run: |
          VERSION="${{ needs.check.outputs.version }}"
          OUT_DIR="$RUNNER_TEMP/relay-artifacts"
          mkdir -p "$OUT_DIR"

          targets=(
            'amd64:amd64:'
            '386:386:'
            'arm64:arm64:'
            'armv7:arm:7'
            'armv6:arm:6'
            'armv5:arm:5'
            'riscv64:riscv64:'
            'ppc64:ppc64:'
            'ppc64le:ppc64le:'
            's390x:s390x:'
            'loong64:loong64:'
            'mips:mips:'
            'mipsle:mipsle:'
            'mips64:mips64:'
            'mips64le:mips64le:'
          )

          for target in "${targets[@]}"; do
            IFS=: read -r artifact_arch goarch goarm <<< "$target"
            stage="$RUNNER_TEMP/tgproxy-relay-${artifact_arch}"
            rm -rf "$stage"
            mkdir -p "$stage/packaging"

            build_env=(env CGO_ENABLED=0 GOOS=linux GOARCH="$goarch")
            if [ -n "$goarm" ]; then build_env+=(GOARM="$goarm"); fi
            "${build_env[@]}" go build -trimpath \
              -ldflags="-s -w -X github.com/Dushnyj/TG-Proxy-Relay/internal/relay.Version=${VERSION}" \
              -o "$stage/tgproxy-relay" ./cmd/tgproxy-relay

            cp README.md LICENSE config.example.json "$stage/"
            cp -R docs "$stage/"
            cp packaging/tgproxy-relay.service "$stage/packaging/"

            tar -C "$stage" -czf "$OUT_DIR/TG-Proxy-Relay-v${VERSION}-linux-${artifact_arch}.tar.gz" .
          done

      - name: List VPS Relay artifacts
        shell: bash
        run: ls -lh "$RUNNER_TEMP/relay-artifacts"

      - name: Upload VPS Relay artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: tg-proxy-relay-${{ needs.check.outputs.version }}
          path: ${{ runner.temp }}/relay-artifacts/*
          if-no-files-found: error

  publish:
    name: Publish VPS Relay GitHub Release
    runs-on: ubuntu-latest
    needs:
      - check
      - build-relay

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.check.outputs.tag }}

      - name: Download VPS Relay artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          name: tg-proxy-relay-${{ needs.check.outputs.version }}
          path: release-artifacts

      - name: Generate checksums
        shell: bash
        run: |
          cd release-artifacts
          sha256sum *.tar.gz > SHA256SUMS.txt

      - name: List release artifacts
        shell: bash
        run: ls -lh release-artifacts

      - name: Prepare release notes
        shell: bash
        run: |
          VERSION="${{ needs.check.outputs.version }}"
          awk -v version="$VERSION" '
            $0 ~ "^## \\[" version "\\]" { capture=1; next }
            capture && $0 ~ "^## \\[" { exit }
            capture { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            {
              echo "TG Proxy VPS Relay $VERSION"
              echo
              echo "See CHANGELOG.md for details."
            } > release-notes.md
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3.0.3
        with:
          tag_name: ${{ needs.check.outputs.tag }}
          name: TG Proxy VPS Relay v${{ needs.check.outputs.version }}
          body_path: release-notes.md
          draft: false
          prerelease: false
          files: release-artifacts/*
