name: TG Proxy VPS Relay CI and Release
run-name: ${{ github.event_name == 'workflow_dispatch' && format('Release TG Proxy VPS Relay {0}', github.event.inputs.tag) || startsWith(github.ref, 'refs/tags/') && format('Release TG Proxy VPS Relay {0}', github.ref_name) || format('Verify TG Proxy VPS Relay {0}', github.ref_name) }}

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, for example v1.0.0'
        required: true
        type: string

permissions:
  contents: write

jobs:
  check:
    name: Verify
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      is_release: ${{ steps.version.outputs.is_release }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref }}

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          IS_RELEASE="false"
          TAG=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
            IS_RELEASE="true"
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF_NAME}"
            IS_RELEASE="true"
          fi
          FILE_VERSION="$(tr -d '[:space:]' < VERSION)"
          VERSION="$FILE_VERSION"
          if [ "$IS_RELEASE" = "true" ]; then
            VERSION="${TAG#v}"
            if [ "$VERSION" != "$FILE_VERSION" ]; then
              echo "Tag version $VERSION does not match VERSION file $FILE_VERSION" >&2
              exit 1
            fi
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "is_release=$IS_RELEASE" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@v6.4.0
        with:
          go-version: '1.22.x'
          cache: false

      - name: Run Go tests
        run: go test ./...

  build-relay:
    name: Build VPS Relay release archives
    runs-on: ubuntu-latest
    needs: check
    if: needs.check.outputs.is_release == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3
        with:
          ref: ${{ needs.check.outputs.tag }}

      - name: Set up Go
        uses: actions/setup-go@v6.4.0
        with:
          go-version: '1.22.x'
          cache: false

      - name: Build linux archives
        shell: bash
        run: |
          VERSION="${{ needs.check.outputs.version }}"
          OUT_DIR="$RUNNER_TEMP/relay-artifacts"
          mkdir -p "$OUT_DIR"

          for arch in amd64 arm64; do
            stage="$RUNNER_TEMP/tgproxy-relay-${arch}"
            rm -rf "$stage"
            mkdir -p "$stage/packaging"

            GOOS=linux GOARCH="$arch" go build -trimpath \
              -ldflags="-s -w -X github.com/Dushnyj/TG-Proxy-Relay/internal/relay.Version=${VERSION}" \
              -o "$stage/tgproxy-relay" ./cmd/tgproxy-relay

            cp README.md LICENSE config.example.json "$stage/"
            cp -R docs "$stage/"
            cp packaging/tgproxy-relay.service "$stage/packaging/"

            tar -C "$stage" -czf "$OUT_DIR/TG-Proxy-Relay-v${VERSION}-linux-${arch}.tar.gz" .
          done

      - name: List VPS Relay artifacts
        shell: bash
        run: ls -lh "$RUNNER_TEMP/relay-artifacts"

      - name: Upload VPS Relay artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: tg-proxy-relay-${{ needs.check.outputs.version }}
          path: ${{ runner.temp }}/relay-artifacts/*
          if-no-files-found: error

  publish:
    name: Publish VPS Relay GitHub Release
    runs-on: ubuntu-latest
    if: needs.check.outputs.is_release == 'true'
    needs:
      - check
      - build-relay

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3
        with:
          ref: ${{ needs.check.outputs.tag }}

      - name: Download VPS Relay artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          name: tg-proxy-relay-${{ needs.check.outputs.version }}
          path: release-artifacts

      - name: Generate checksums
        shell: bash
        run: |
          cd release-artifacts
          sha256sum *.tar.gz > SHA256SUMS.txt

      - name: List release artifacts
        shell: bash
        run: ls -lh release-artifacts

      - name: Prepare release notes
        shell: bash
        run: |
          VERSION="${{ needs.check.outputs.version }}"
          awk -v version="$VERSION" '
            $0 ~ "^## \\[" version "\\]" { capture=1; next }
            capture && $0 ~ "^## \\[" { exit }
            capture { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            {
              echo "TG Proxy VPS Relay $VERSION"
              echo
              echo "See CHANGELOG.md for details."
            } > release-notes.md
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3.0.0
        with:
          tag_name: ${{ needs.check.outputs.tag }}
          name: TG Proxy VPS Relay v${{ needs.check.outputs.version }}
          body_path: release-notes.md
          draft: false
          prerelease: false
          files: release-artifacts/*
